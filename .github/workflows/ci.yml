name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The header requires PHP 8.2; 8.1 was tested against a floor the plugin does not support.
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, mbstring, json, openssl, libxml, simplexml, gd

      - name: Run Standalone Test Suite
        # The WP-CLI suites need WordPress and two of them empty the register: not for CI.
        run: |
          php tests/test-suite.php

      # `wp i18n make-pot` IS the definition of a fresh catalog in the step below, so wp-cli is a
      # hard requirement there rather than something it shrugs off. Into $HOME/bin, not the
      # workspace: an executable in the repo root would land in the copy the mutation runner makes.
      # No workflow input reaches these commands; the URL is a literal.
      - name: Install WP-CLI
        if: matrix.php-version == '8.3'
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$HOME/bin/wp"
          chmod +x "$HOME/bin/wp"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # This catalog was current on 2026-09-20 (253 strings, 254 entries). Fifteen of the fleet's
      # twenty-four were not, and none of them had a check that could notice.
      - name: Translation catalog freshness
        if: matrix.php-version == '8.3'
        run: php tests/test-pot-freshness.php

      - name: Mutation check
        # Each entry of tests/mutations.php undoes one correction; the suite must turn red for every one.
        # ~50 min per run: once per pull request on 8.3 only. Running it on both PHP legs and again
        # on the push to main after the merge cost ~4x the Actions minutes (measured 2026-11-06).
        if: matrix.php-version == '8.3' && github.event_name == 'pull_request'
        run: bash tests/run-mutations.sh

      - name: Compliance & Security Audit
        run: python3 .github/scripts/security-audit.py

      - name: CRA / SBOM Validation
        run: |
          # El mandato SBOM del Cyber Resilience Act aplica desde el 2027-12-11.
          # Hasta que la flota tenga SBOMs esto avisa, no rompe el build.
          if [ ! -f "bom.json" ]; then
            echo "::warning::bom.json (SBOM) ausente — pendiente para el CRA (2027-12-11)."
          else
            echo "bom.json presente."
          fi
